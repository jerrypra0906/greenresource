server {
    listen 80;
    server_name
        greenresources.co www.greenresources.co
        green-resources.org www.green-resources.org
        greenresources.id www.greenresources.id
        green-resources.id www.green-resources.id;
    index index.php index.html;
    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
    root /var/www/html/public;
    
    # Send public hosts to the canonical HTTPS domain.
    # localhost and 127.0.0.1 stay on this server so local Docker can be browsed.
    set $redirect_canonical 0;
    if ($host != "greenresources.co") {
        set $redirect_canonical 1;
    }
    if ($host = "localhost") {
        set $redirect_canonical 0;
    }
    if ($host = "127.0.0.1") {
        set $redirect_canonical 0;
    }
    if ($redirect_canonical = 1) {
        return 301 https://greenresources.co$request_uri;
    }
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;
    gzip_disable "msie6";
    gzip_min_length 1000;
    
    # FastCGI optimizations
    fastcgi_buffers 16 16k;
    fastcgi_buffer_size 32k;
    fastcgi_read_timeout 300;
    fastcgi_send_timeout 300;
    
    # Re-resolve the "app" upstream on every request instead of caching its IP
    # for the life of the worker process. Without this, nginx keeps the IP it
    # resolved at startup; if `app` is later rebuilt/recreated (e.g. `docker
    # compose up --build`) without also restarting nginx, it gets a new IP on
    # the Docker network and nginx keeps hitting the old, now-dead address
    # ("connect() failed (111: Connection refused)" -> 502 Bad Gateway).
    # 127.0.0.11 is Docker's embedded DNS server on the default bridge network.
    resolver 127.0.0.11 valid=10s;

    # PHP-FPM location
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        set $php_upstream app:9000;
        fastcgi_pass $php_upstream;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }
    
    # Static assets caching (images, CSS, JS)
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        log_not_found off;
    }
    
    # HTML caching
    location ~* \.html$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }
    
    # Main location - must come last
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
    
    # Deny access to hidden files
    location ~ /\.(?!well-known).* {
        deny all;
    }
    
    # Deny access to storage and other sensitive directories
    location ~ ^/(storage|bootstrap|vendor|config|database|routes|app|resources) {
        deny all;
    }
}

